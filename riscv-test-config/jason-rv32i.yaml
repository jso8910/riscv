$schema: config_schema.json#

kind: architecture configuration
type: fully configured

name: jason-rv32i
description: RV32I with standard machine-mode support

params:
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32
  M_MODE_ENDIANNESS: little

  # ------------------------------------------------------------
  # Exceptions/traps
  #
  # The core takes synchronous exceptions precisely at the faulting PC.
  # ------------------------------------------------------------

  PRECISE_SYNCHRONOUS_EXCEPTIONS: true

  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true

  TRAP_ON_ILLEGAL_WLRL: false
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true

  # ------------------------------------------------------------
  # mtval
  # ------------------------------------------------------------

  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: false

  MTVAL_WIDTH: 32

  # ------------------------------------------------------------
  # Misaligned loads/stores
  #
  # Set this to match YOUR hardware.
  # The SRAM is byte-addressed and the memory controller enables the
  # participating byte lanes directly, so scalar LH/LW/SH/SW misalignment
  # completes in hardware rather than trapping.
  # ------------------------------------------------------------

  MISALIGNED_LDST: true
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  MISALIGNED_MAX_ATOMICITY_GRANULE_SIZE: 0
  MISALIGNED_SPLIT_STRATEGY: sequential_bytes

  # ------------------------------------------------------------
  # Machine identification CSRs
  # ------------------------------------------------------------

  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false

  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0

  CONFIG_PTR_ADDRESS: 0

  # ------------------------------------------------------------
  # misa
  # ------------------------------------------------------------

  MISA_CSR_IMPLEMENTED: true

  # ------------------------------------------------------------
  # mtvec
  #
  # Both direct and vectored modes have 4-byte base alignment.
  # ------------------------------------------------------------

  MTVEC_ACCESS: rw
  MTVEC_MODES: [0, 1]
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: retain

  # ------------------------------------------------------------
  # PMA / PMP
  # ------------------------------------------------------------

  PMA_GRANULARITY: 2
  NUM_PMP_ENTRIES: 64
  PMP_GRANULARITY: 2
  NUM_USABLE_PMP_ENTRIES: 64
  PMP_NA4_SUPPORTED: true
  PMP_NAPOT_SUPPORTED: true
  PMP_TOR_SUPPORTED: true

  # ------------------------------------------------------------
  # Performance counters
  # ------------------------------------------------------------

  TIME_CSR_IMPLEMENTED: false

  HPM_COUNTER_EN:
    [
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false
    ]

  MCOUNTINHIBIT_IMPLEMENTED: true

  COUNTINHIBIT_EN:
    [
      true, false, true, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false
    ]

  MCOUNTENABLE_EN:
    [
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false,
      false, false, false, false
    ]

implemented_extensions:
  - name: I
    version: "= 2.1"
  - name: Zicntr
    version: "= 2.0"
  - name: Zihpm
    version: "= 2.0"
  - name: Zicsr
    version: "= 2.0"
  - name: Sm
    version: "= 1.12.0"

additional_extensions: false
